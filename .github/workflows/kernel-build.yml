name: Kernel build

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Ветка форка для сборки"
        default: "ksu-next"
      defconfigs:
        description: "Defconfig и фрагменты через пробел"
        default: "vendor/kona-perf_defconfig"
      clang_version:
        description: "Версия Clang из apt.llvm.org"
        default: "20"

permissions:
  contents: read

env:
  DEFCONFIGS: ${{ inputs.defconfigs }}
  CLANG_VERSION: ${{ inputs.clang_version }}
  MAKE_FLAGS: >-
    O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
    OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
    CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-
    CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS=-Wno-error
    KBUILD_BUILD_USER=ghost KBUILD_BUILD_HOST=actions

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout kernel with submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 1
          submodules: recursive

      - name: Deepen KernelSU history (for version number)
        run: |
          git -C KernelSU fetch --tags --unshallow || git -C KernelSU fetch --tags --depth=500 || true
          echo "KernelSU commits: $(git -C KernelSU rev-list --count HEAD)"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio lz4 zstd \
            device-tree-compiler python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$CLANG_VERSION"
          echo "/usr/lib/llvm-$CLANG_VERSION/bin" >> "$GITHUB_PATH"

      - name: Show KernelSU hook options (info)
        continue-on-error: true
        run: |
          echo "--- Kconfig: опции хуков ---"
          grep -n -B1 -A12 -E "config KSU_(SYSCALL_TABLE_HOOK|KPROBES_HOOK|MANUAL_HOOK)" KernelSU/kernel/Kconfig || true

      - name: Show what the device tree uses (info only)
        continue-on-error: true
        run: |
          for b in lineage-24.0 lineage-23.2; do
            url="https://raw.githubusercontent.com/LineageOS/android_device_xiaomi_sm8250-common/$b/BoardConfigCommon.mk"
            if curl -fsSL "$url" -o board.mk; then
              echo "Источник: $b"
              grep -n "TARGET_KERNEL" board.mk || true
              break
            fi
          done
          ls arch/arm64/configs/vendor | head -80

      - name: Configure (defconfig + KernelSU syscall table hook)
        run: |
          set -e
          clang --version | head -n1
          make $MAKE_FLAGS $DEFCONFIGS
          scripts/config --file out/.config -e KSU -e KSU_SYSCALL_TABLE_HOOK -d KSU_MANUAL_HOOK -d KSU_KPROBES_HOOK
          make $MAKE_FLAGS olddefconfig
          echo "--- Итоговые опции ---"
          grep -E '^(# )?CONFIG_(KSU|KSU_SYSCALL_TABLE_HOOK|KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|KPROBES|MODVERSIONS|MODULES)[ =]' out/.config || true
          grep -q '^CONFIG_KSU=y' out/.config || { echo "CONFIG_KSU не включился"; exit 1; }
          grep -q '^CONFIG_KSU_SYSCALL_TABLE_HOOK=y' out/.config || {
            echo "CONFIG_KSU_SYSCALL_TABLE_HOOK не включился (смотри зависимости в Kconfig выше)"
            exit 1
          }

      - name: Build Image and DTBs
        run: |
          set -o pipefail
          make -j"$(nproc)" $MAKE_FLAGS Image dtbs 2>&1 | tee build.log

      - name: Summary
        if: success()
        run: |
          {
            echo "### Сборка прошла"
            echo "- Release: $(make -s $MAKE_FLAGS kernelrelease)"
            echo "- Image: $(du -h out/arch/arm64/boot/Image | cut -f1)"
            echo "- Hook mode: $(grep -m1 'Hook mode' build.log || echo 'не найдено в логе')"
            echo '```'
            grep -E '^CONFIG_(KSU|KSU_SYSCALL_TABLE_HOOK)=' out/.config
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show errors
        if: failure()
        run: |
          {
            echo "### Контекст первой ошибки"
            echo '```'
            if [ -f build.log ]; then
              n=$(grep -n -m1 -E '\*\*\* \[|error:' build.log | cut -d: -f1)
              if [ -n "$n" ]; then
                start=$(( n > 25 ? n - 25 : 1 ))
                sed -n "${start},$((n+3))p" build.log
              else
                tail -n 40 build.log
              fi
            else
              echo "build.log нет: ошибка произошла до сборки (смотри шаги выше)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          if-no-files-found: warn
          path: |
            build.log
            out/.config
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/**/*.dtb
