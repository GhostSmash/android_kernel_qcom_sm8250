name: Kernel build

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Ветка форка для сборки"
        default: "ksu-next"
      defconfigs:
        description: "Defconfig и фрагменты через пробел"
        default: "vendor/kona-perf_defconfig"
      clang_version:
        description: "Версия Clang из apt.llvm.org"
        default: "20"
      only_ksu:
        description: "Быстрая проверка: собрать только drivers/kernelsu"
        type: boolean
        default: true

permissions:
  contents: read

env:
  DEFCONFIGS: ${{ inputs.defconfigs }}
  CLANG_VERSION: ${{ inputs.clang_version }}
  MAKE_FLAGS: >-
    O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
    OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
    CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-
    CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS=-Wno-error
    KBUILD_BUILD_USER=ghost KBUILD_BUILD_HOST=actions

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout kernel with submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 1
          submodules: recursive

      - name: Deepen KernelSU history (for version number)
        run: |
          git -C KernelSU fetch --tags --unshallow || git -C KernelSU fetch --tags --depth=500 || true
          echo "KernelSU commits: $(git -C KernelSU rev-list --count HEAD)"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio lz4 zstd \
            device-tree-compiler python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$CLANG_VERSION"
          echo "/usr/lib/llvm-$CLANG_VERSION/bin" >> "$GITHUB_PATH"

      - name: Diagnostics for KernelSU compat (to Summary)
        continue-on-error: true
        run: |
          {
            echo "### Диагностика: patch_memory.c (строки 1-50)"
            echo '```c'
            sed -n '1,50p' KernelSU/kernel/hook/patch_memory.c
            echo '```'
            echo "### Где встречается copy_to_kernel_nofault / probe_kernel_write в KernelSU"
            echo '```'
            grep -rn -E "copy_to_kernel_nofault|probe_kernel_write" KernelSU/kernel | head -25 || true
            echo '```'
            echo "### uaccess.h ядра (строки 290-312)"
            echo '```c'
            sed -n '290,312p' include/linux/uaccess.h
            echo '```'
            echo "### define-ы в ядре"
            echo '```'
            grep -rn -E "define (probe_kernel_write|copy_to_kernel_nofault)" include arch/arm64 | head -10 || echo "нет"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure (defconfig + KernelSU syscall table hook)
        run: |
          set -e
          clang --version | head -n1
          make $MAKE_FLAGS $DEFCONFIGS
          scripts/config --file out/.config -e KSU -e KSU_SYSCALL_TABLE_HOOK -d KSU_MANUAL_HOOK -d KSU_KPROBES_HOOK
          make $MAKE_FLAGS olddefconfig
          echo "--- Итоговые опции ---"
          grep -E '^(# )?CONFIG_(KSU|KSU_SYSCALL_TABLE_HOOK|KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|KPROBES|MODVERSIONS|MODULES)[ =]' out/.config || true
          grep -q '^CONFIG_KSU=y' out/.config || { echo "CONFIG_KSU не включился"; exit 1; }
          grep -q '^CONFIG_KSU_SYSCALL_TABLE_HOOK=y' out/.config || {
            echo "CONFIG_KSU_SYSCALL_TABLE_HOOK не включился"
            exit 1
          }

      - name: Quick build (only drivers/kernelsu)
        if: ${{ inputs.only_ksu }}
        run: |
          set -o pipefail
          make -j"$(nproc)" $MAKE_FLAGS prepare 2>&1 | tee build.log
          make -k -j"$(nproc)" $MAKE_FLAGS drivers/kernelsu/ 2>&1 | tee -a build.log

      - name: Full build (Image and DTBs)
        if: ${{ !inputs.only_ksu }}
        run: |
          set -o pipefail
          make -j"$(nproc)" $MAKE_FLAGS Image dtbs 2>&1 | tee build.log

      - name: Summary (quick)
        if: ${{ success() && inputs.only_ksu }}
        run: |
          {
            echo "### drivers/kernelsu собрался без ошибок"
            echo "- Hook mode: $(grep -m1 'Hook mode' build.log || echo 'не найдено в логе')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (full)
        if: ${{ success() && !inputs.only_ksu }}
        run: |
          {
            echo "### Сборка прошла"
            echo "- Release: $(make -s $MAKE_FLAGS kernelrelease)"
            echo "- Image: $(du -h out/arch/arm64/boot/Image | cut -f1)"
            echo "- Hook mode: $(grep -m1 'Hook mode' build.log || echo 'не найдено в логе')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show errors
        if: failure()
        run: |
          {
            echo "### Первые ошибки сборки"
            echo '```'
            if [ -f build.log ]; then
              grep -n -E 'error:|\*\*\* \[' build.log | head -20 || tail -n 40 build.log
            else
              echo "build.log нет: ошибка до сборки (смотри шаги выше)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          if-no-files-found: warn
          path: |
            build.log
            out/.config
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/**/*.dtb
