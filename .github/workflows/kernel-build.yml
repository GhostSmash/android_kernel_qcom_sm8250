name: Kernel build

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Ветка форка для сборки"
        default: "ksu-next"
      defconfigs:
        description: "Defconfig и фрагменты через пробел"
        default: "vendor/kona-perf_defconfig"
      clang_version:
        description: "Версия Clang из apt.llvm.org"
        default: "20"
      only_ksu:
        description: "Быстрая проверка: собрать только drivers/kernelsu"
        type: boolean
        default: true
      stock_boot_url:
        description: "Ссылка на стоковый boot.img (для сборки boot_ksu.img)"
        default: ""

permissions:
  contents: read

env:
  DEFCONFIGS: ${{ inputs.defconfigs }}
  CLANG_VERSION: ${{ inputs.clang_version }}
  MAKE_FLAGS: >-
    O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
    OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
    CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-
    CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS=-Wno-error
    KBUILD_BUILD_USER=ghost KBUILD_BUILD_HOST=actions

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout kernel with submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 1
          submodules: recursive

      - name: Deepen KernelSU history (for version number)
        run: |
          git -C KernelSU fetch --tags --unshallow || git -C KernelSU fetch --tags --depth=500 || true
          echo "KernelSU commits: $(git -C KernelSU rev-list --count HEAD)"

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio lz4 zstd \
            device-tree-compiler python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$CLANG_VERSION"
          echo "/usr/lib/llvm-$CLANG_VERSION/bin" >> "$GITHUB_PATH"

      - name: Patch KernelSU compat (copy_to_kernel_nofault)
        run: |
          set -e
          f=KernelSU/kernel/hook/patch_memory.c
          grep -q 'copy_to_kernel_nofault' include/linux/uaccess.h
          sed -i '1,25s/^#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 8, 0)/#if 0/' "$f"
          grep -q '^#if 0' "$f" || { echo "правка не применилась"; exit 1; }

      - name: Backport path_umount (fs/namespace.c)
        run: |
          set -e
          python3 - <<'PY'
          import sys
          p = "fs/namespace.c"
          s = open(p).read()
          if "int path_umount(" in s:
              print("path_umount уже есть, пропускаю")
              sys.exit(0)
          marker = "SYSCALL_DEFINE2(umount, char __user *, name, int, flags)"
          i = s.find(marker)
          if i == -1:
              print("не найден SYSCALL_DEFINE2(umount ...)")
              sys.exit(1)
          code = '''static int ksu_can_umount(const struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);

          	if (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))
          		return -EINVAL;
          	if (!may_mount())
          		return -EPERM;
          	if (path->dentry != path->mnt->mnt_root)
          		return -EINVAL;
          	if (!check_mnt(mnt))
          		return -EINVAL;
          	if (mnt->mnt.mnt_flags & MNT_LOCKED) /* Check optimistically */
          		return -EINVAL;
          	if (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))
          		return -EPERM;
          	return 0;
          }

          int path_umount(struct path *path, int flags)
          {
          	struct mount *mnt = real_mount(path->mnt);
          	int ret;

          	ret = ksu_can_umount(path, flags);
          	if (!ret)
          		ret = do_umount(mnt, flags);

          	/* we mustn't call path_put() as that would clear mnt_expiry_mark */
          	dput(path->dentry);
          	mntput_no_expire(mnt);
          	return ret;
          }

          '''
          code = "\n".join(l[10:] if l.startswith(" " * 10) else l for l in code.split("\n"))
          s = s[:i] + code + s[i:]
          open(p, "w").write(s)
          print("path_umount добавлен")
          PY
          grep -n "int path_umount" fs/namespace.c

      - name: Configure (defconfig + KernelSU syscall table hook)
        run: |
          set -e
          clang --version | head -n1
          make $MAKE_FLAGS $DEFCONFIGS
          scripts/config --file out/.config -e KSU -e KSU_SYSCALL_TABLE_HOOK -d KSU_MANUAL_HOOK -d KSU_KPROBES_HOOK
          make $MAKE_FLAGS olddefconfig
          echo "--- Итоговые опции ---"
          grep -E '^(# )?CONFIG_(KSU|KSU_SYSCALL_TABLE_HOOK|KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|KPROBES|MODVERSIONS|MODULES)[ =]' out/.config || true
          grep -q '^CONFIG_KSU=y' out/.config || { echo "CONFIG_KSU не включился"; exit 1; }
          grep -q '^CONFIG_KSU_SYSCALL_TABLE_HOOK=y' out/.config || {
            echo "CONFIG_KSU_SYSCALL_TABLE_HOOK не включился"
            exit 1
          }

      - name: Pre-generate headers (prepare, scripts, SELinux flask.h)
        run: |
          set -o pipefail
          make -j"$(nproc)" $MAKE_FLAGS prepare scripts 2>&1 | tee build.log
          make -j"$(nproc)" $MAKE_FLAGS security/selinux/flask.h 2>&1 | tee -a build.log \
            || make -j"$(nproc)" $MAKE_FLAGS security/selinux/ 2>&1 | tee -a build.log

      - name: Quick build (only drivers/kernelsu)
        if: ${{ inputs.only_ksu }}
        run: |
          set -o pipefail
          make -k -j"$(nproc)" $MAKE_FLAGS drivers/kernelsu/ 2>&1 | tee -a build.log

      - name: Full build (Image and DTBs)
        if: ${{ !inputs.only_ksu }}
        run: |
          set -o pipefail
          make -j"$(nproc)" $MAKE_FLAGS Image dtbs 2>&1 | tee -a build.log

      - name: Make boot.img (repack stock boot with our kernel)
        if: ${{ !inputs.only_ksu && inputs.stock_boot_url != '' }}
        env:
          STOCK_BOOT_URL: ${{ inputs.stock_boot_url }}
        run: |
          set -e
          mkdir -p work
          cd work
          git clone -q --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg
          git clone -q --depth=1 https://android.googlesource.com/platform/external/avb avb
          curl -fL "$STOCK_BOOT_URL" -o stock_boot.img
          ls -l stock_boot.img

          echo "=== Параметры стокового boot.img ==="
          python3 mkbootimg/unpack_bootimg.py --boot_img stock_boot.img --out unpacked | tee boot_info.txt
          python3 mkbootimg/unpack_bootimg.py --boot_img stock_boot.img --out unpacked --format=mkbootimg > mkargs.txt
          echo "mkbootimg args: $(cat mkargs.txt)"

          kmagic=$(od -An -tx1 -N4 unpacked/kernel | tr -d ' \n')
          echo "Магия ядра в стоке: $kmagic"
          case "$kmagic" in
            1f8b*)    kfmt=gzip; zcat unpacked/kernel > stock_Image ;;
            02214c18) kfmt=lz4l; lz4 -dc unpacked/kernel > stock_Image ;;
            04224d18) kfmt=lz4;  lz4 -dc unpacked/kernel > stock_Image ;;
            *)        kfmt=raw;  cp unpacked/kernel stock_Image ;;
          esac
          NEW=../out/arch/arm64/boot/Image
          echo "Стоковое ядро: $(strings -n 20 stock_Image | grep -m1 'Linux version 4' || echo не найдено)"
          echo "Наше ядро:     $(strings -n 20 $NEW | grep -m1 'Linux version 4' || echo не найдено)"

          case "$kfmt" in
            gzip) gzip -9 -c "$NEW" > unpacked/kernel ;;
            lz4l) lz4 -l -12 -c "$NEW" > unpacked/kernel ;;
            lz4)  lz4 -12 -c "$NEW" > unpacked/kernel ;;
            raw)  cp "$NEW" unpacked/kernel ;;
          esac

          eval "python3 mkbootimg/mkbootimg.py $(cat mkargs.txt) -o boot_ksu.img"

          echo "=== AVB footer ==="
          if python3 avb/avbtool.py info_image --image stock_boot.img > avb_info.txt 2>&1; then
            cat avb_info.txt
            PSIZE=$(grep -m1 '^Image size:' avb_info.txt | awk '{print $3}')
            echo "Размер раздела: $PSIZE"
            python3 avb/avbtool.py add_hash_footer --image boot_ksu.img \
              --partition_size "$PSIZE" --partition_name boot
          else
            echo "У стокового boot.img нет AVB-футера, пропускаю"
          fi
          ls -l boot_ksu.img
          sha256sum boot_ksu.img

      - name: Summary (quick)
        if: ${{ success() && inputs.only_ksu }}
        run: |
          {
            echo "### drivers/kernelsu собрался без ошибок"
            echo "- Hook mode: $(grep -m1 'Hook mode' build.log || echo 'не найдено в логе')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (full)
        if: ${{ success() && !inputs.only_ksu }}
        run: |
          {
            echo "### Сборка прошла"
            echo "- Release: $(make -s $MAKE_FLAGS kernelrelease)"
            echo "- Image: $(du -h out/arch/arm64/boot/Image | cut -f1)"
            echo "- Hook mode: $(grep -m1 'Hook mode' build.log || echo 'не найдено в логе')"
            if [ -f work/boot_ksu.img ]; then
              echo "- boot_ksu.img: $(du -h work/boot_ksu.img | cut -f1)"
              echo '```'
              head -n 20 work/boot_info.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show errors
        if: failure()
        run: |
          {
            echo "### Первые ошибки сборки"
            echo '```'
            if [ -f build.log ]; then
              grep -n -E 'error:|\*\*\* \[|undefined (reference|symbol)' build.log | head -20 || tail -n 40 build.log
            else
              echo "build.log нет: ошибка до сборки (смотри шаги выше)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            build.log
            out/.config
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/**/*.dtb
            work/boot_ksu.img
            work/boot_info.txt
            work/avb_info.txt
